# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mgts25/newavi
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/24f9e953-bb44-4b1d-bd9f-f4b7f6c53dd3/pkce
  auth_token_endpoint: /sites/24f9e953-bb44-4b1d-bd9f-f4b7f6c53dd3/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://cosmic-dragon-248062.netlify.app

# Editors sign in via DecapBridge (Google); every change they save here is
# committed straight to the GitHub repo, which triggers a new Netlify build.
# NOTE: paths below are prefixed with "everplay-site/" because that's where
# the actual project lives inside the mgts25/newavi repo (repo root itself
# is NOT the project root).
media_folder: "everplay-site/src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "games"
    label: "Game Library"
    files:
      - name: "games"
        label: "Games"
        file: "everplay-site/src/_data/gameLibrary.json"
        fields:
          - label: "Games"
            name: "games"
            widget: "list"
            summary: "{{title}} — {{genre}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Genre", name: "genre", widget: "string" }
              - { label: "Price Label", name: "price", widget: "string", default: "Free", hint: "Shown under the game tile, e.g. Free, $2.99, Coming Soon" }
              - { label: "Coming Soon", name: "comingSoon", widget: "boolean", default: false, hint: "Show a placeholder tile instead of a cover image — use this for games you haven't uploaded art for yet" }
              - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Not needed while Coming Soon is checked" }
              - { label: "Game Logo (optional)", name: "logo", widget: "image", required: false, hint: "A wide, transparent-background logo/wordmark — it overlays the bottom of the cover image. Leave blank to show a plain icon badge instead." }
              - label: "Icon Badge"
                name: "icon"
                widget: "string"
                hint: "A Material Symbols icon name, e.g. rocket_launch, swords, speed. Browse names at fonts.google.com/icons"
              - label: "Accent Color"
                name: "accent"
                widget: "select"
                default: "primary"
                options:
                  - { label: "Green", value: "primary" }
                  - { label: "Light Green", value: "primary-container" }
                  - { label: "Blue", value: "tertiary" }
                  - { label: "Light Blue", value: "tertiary-container" }
                  - { label: "Gray", value: "secondary" }
              - { label: "Preview Video (optional)", name: "video", widget: "file", required: false, hint: "Upload a short .mp4 (a few seconds, ideally under ~8MB). If a Cover Image is also set, this plays on hover. If there's no Cover Image, this plays on a continuous loop as the tile itself — use that for a game that only has footage so far." }

  - name: "pricing"
    label: "Pricing Page"
    files:
      - name: "pricing"
        label: "Pricing Tiers & FAQ"
        file: "everplay-site/src/_data/pricing.json"
        fields:
          - label: "Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{name}} — {{price}}"
            fields:
              - { label: "Badge", name: "badge", widget: "string", hint: "e.g. Free Tier, Premium, On-Demand" }
              - { label: "Tier Name", name: "name", widget: "string" }
              - { label: "Price Prefix (optional)", name: "priceLabel", widget: "string", required: false, hint: "e.g. \"From\"" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Price Suffix (optional)", name: "priceSuffix", widget: "string", required: false, hint: "e.g. \"/mo\"" }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
              - { label: "Button Text", name: "cta", widget: "string" }
              - { label: "Highlight as \"Most Popular\"", name: "featured", widget: "boolean", default: false }
          - { label: "FAQ Heading", name: "faqHeading", widget: "string" }
          - { label: "FAQ Subtext", name: "faqSubtext", widget: "text" }

  - name: "about"
    label: "About Page"
    files:
      - name: "team"
        label: "About Content & Team"
        file: "everplay-site/src/_data/team.json"
        fields:
          - label: "Company Timeline"
            name: "timeline"
            widget: "list"
            summary: "{{year}} — {{title}}"
            hint: "Shown as an interactive timeline on the About page. Add new milestones here any time — no redesign needed."
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Milestone Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Team Members"
            name: "members"
            widget: "list"
            summary: "{{name}} — {{role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", hint: "Only shown when a visitor clicks the team member's card" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "LinkedIn URL (optional)", name: "linkedin", widget: "string", required: false, hint: "Leave blank to hide the icon on this member's card" }
          - { label: "CTA Heading", name: "ctaHeading", widget: "string" }
          - { label: "CTA Body", name: "ctaBody", widget: "text" }

  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Settings"
        file: "everplay-site/src/_data/home.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subtext", name: "subtext", widget: "text" }

  - name: "careers"
    label: "Careers"
    files:
      - name: "careers"
        label: "Open Positions"
        file: "everplay-site/src/_data/careers.json"
        fields:
          - label: "Positions"
            name: "positions"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - { label: "Position Title", name: "title", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string", hint: "A single emoji shown on the card, e.g. 🎮" }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "Open Position"
                options:
                  - { label: "Open Position", value: "Open Position" }
                  - { label: "Opportunity Being Considered", value: "Opportunity Being Considered" }
                hint: "Only use \"Open Position\" if MULTIVERSE is actually accepting applications for this role right now."
              - { label: "Focus", name: "focus", widget: "text", hint: "One-line summary of what this role focuses on" }
              - { label: "Responsibilities", name: "responsibilities", widget: "text" }
              - { label: "Requirements", name: "requirements", widget: "text" }

  - name: "shop"
    label: "Verse Shop"
    files:
      - name: "verseShop"
        label: "Verse Packages"
        file: "everplay-site/src/_data/verseShop.json"
        fields:
          - { label: "Intro Text", name: "intro", widget: "text" }
          - label: "Packages"
            name: "packages"
            widget: "list"
            summary: "{{amount}} Verse — {{price}}"
            fields:
              - { label: "Verse Amount", name: "amount", widget: "number", value_type: "int", hint: "Base Verse you get before any bonus" }
              - { label: "Bonus %", name: "bonusPercent", widget: "number", value_type: "int", default: 0, hint: "e.g. 15 for a +15% bonus" }
              - { label: "Bonus Amount", name: "bonusAmount", widget: "number", value_type: "int", default: 0, hint: "The extra Verse the bonus % works out to — keep this in sync with Bonus %" }
              - { label: "Total Verse (amount + bonus)", name: "totalVerse", widget: "number", value_type: "int", hint: "What's shown as the headline number on the card" }
              - { label: "Price", name: "price", widget: "string", hint: "e.g. $4.99" }
              - { label: "Badge (optional)", name: "badge", widget: "string", required: false, hint: "e.g. POPULAR or BEST VALUE — leave blank for none" }
              - { label: "Buy Now Link", name: "buyLink", widget: "string", default: "#", hint: "Paste a Stripe Payment Link (or other checkout URL) here once you've set one up — see note in chat" }
